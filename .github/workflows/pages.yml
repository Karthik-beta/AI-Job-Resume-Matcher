# Publishes site/ (the marketing page) to GitHub Pages. The checks run in ci.yml; this workflow
# only deploys.
name: Pages

on:
  push:
    branches: [master]
    # Only a change to the site redeploys it.
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The deploy needs an OIDC token to prove where the artifact came from, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, so a later push queues behind it rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The site is static files with no build step, so the folder is the artifact as it is.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
